[project]
name = "nova-robot-project"
version = "0.1.0"
description = "Nova mobile manipulation teleoperation and data pipeline"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.26",
  "opencv-python>=4.8",
  "pyrealsense2>=2.55",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
